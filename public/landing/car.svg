<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="0.45" stop-color="#dfe3e8"/>
      <stop offset="0.75" stop-color="#c7cdd5"/>
      <stop offset="1" stop-color="#a9b0ba"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5767"/>
      <stop offset="0.55" stop-color="#2c3440"/>
      <stop offset="1" stop-color="#1f252e"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cdd2d9"/>
      <stop offset="1" stop-color="#8a929d"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b2433" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1b2433" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa2ad"/>
      <stop offset="1" stop-color="#6f7783"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="250" cy="196" rx="232" ry="16" fill="url(#shadow)"/>

  <!-- wheel wells -->
  <path d="M82 160 A40 40 0 0 1 162 160 Z" fill="#3a3f47"/>
  <path d="M318 160 A40 40 0 0 1 398 160 Z" fill="#3a3f47"/>

  <!-- body -->
  <path d="M40 160
           C33 151 33 137 44 129
           C62 117 102 110 142 106
           C172 82 212 64 252 61
           C300 58 334 60 356 72
           C376 84 394 97 412 103
           C434 107 450 114 455 127
           C459 140 457 151 448 160
           L398 160 A40 40 0 0 0 318 160
           L162 160 A40 40 0 0 0 82 160 Z"
        fill="url(#body)" stroke="#aeb5bf" stroke-width="1.2"/>

  <!-- lower sill -->
  <path d="M162 160 L318 160 L314 167 L166 167 Z" fill="url(#sill)"/>

  <!-- greenhouse (windows) -->
  <path d="M160 104 C190 82 224 70 255 68 L338 69 C355 73 371 85 387 98 C330 102 236 105 160 104 Z" fill="url(#glass)"/>
  <!-- window glare -->
  <path d="M188 92 C210 79 232 72 258 71 L262 102 L176 103 Z" fill="url(#glare)"/>
  <!-- B-pillar -->
  <path d="M268 68 L272 68 L276 103 L270 103 Z" fill="#c9ced6"/>

  <!-- shoulder highlight and door lines -->
  <path d="M60 126 C120 116 300 112 446 122" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M272 108 L276 156" stroke="#9ea6b1" stroke-width="1.2"/>
  <path d="M172 108 C170 128 170 142 174 156" fill="none" stroke="#9ea6b1" stroke-width="1.2"/>
  <path d="M360 106 C366 122 368 138 366 156" fill="none" stroke="#9ea6b1" stroke-width="1.2"/>
  <!-- door handles -->
  <rect x="226" y="122" width="22" height="4" rx="2" fill="#a4acb7"/>
  <rect x="318" y="121" width="22" height="4" rx="2" fill="#a4acb7"/>
  <!-- mirror -->
  <path d="M168 104 C164 98 172 94 180 96 L182 104 Z" fill="#cfd4db" stroke="#aeb5bf" stroke-width="0.8"/>

  <!-- lights -->
  <path d="M42 131 C50 126 62 124 72 124 L70 132 C60 133 50 134 42 136 Z" fill="#ffffff" stroke="#9fb7d8" stroke-width="1"/>
  <path d="M446 118 C452 121 455 126 455 131 L440 129 L438 119 Z" fill="#e5484d"/>

  <!-- wheels -->
  <g>
    <circle cx="122" cy="162" r="33" fill="#23272e"/>
    <circle cx="122" cy="162" r="21" fill="url(#rim)"/>
    <g stroke="#8a929d" stroke-width="3" stroke-linecap="round">
      <line x1="122" y1="145" x2="122" y2="179"/><line x1="105" y1="162" x2="139" y2="162"/>
      <line x1="110" y1="150" x2="134" y2="174"/><line x1="134" y1="150" x2="110" y2="174"/>
    </g>
    <circle cx="122" cy="162" r="6" fill="#5c646f"/>
  </g>
  <g>
    <circle cx="358" cy="162" r="33" fill="#23272e"/>
    <circle cx="358" cy="162" r="21" fill="url(#rim)"/>
    <g stroke="#8a929d" stroke-width="3" stroke-linecap="round">
      <line x1="358" y1="145" x2="358" y2="179"/><line x1="341" y1="162" x2="375" y2="162"/>
      <line x1="346" y1="150" x2="370" y2="174"/><line x1="370" y1="150" x2="346" y2="174"/>
    </g>
    <circle cx="358" cy="162" r="6" fill="#5c646f"/>
  </g>
</svg>
